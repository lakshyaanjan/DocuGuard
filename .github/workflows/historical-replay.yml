name: DocuGuard Historical Replay Evaluation

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: Maximum days between a source change and a docs-only follow-up
        required: false
        default: "365"
      max_pairs:
        description: Maximum candidate pairs to replay per project
        required: false
        default: "2"
      llm_mode:
        description: LLM mode (auto labels deterministic fallback during provider outages)
        required: false
        default: "auto"

permissions:
  contents: read

concurrency:
  group: docuguard-historical-replay
  cancel-in-progress: false

jobs:
  replay-public-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout DocuGuard
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout Pallets Click history
        uses: actions/checkout@v4
        with:
          repository: pallets/click
          path: targets/click
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Encode HTTPX history
        uses: actions/checkout@v4
        with:
          repository: encode/httpx
          path: targets/httpx
          fetch-depth: 0
          persist-credentials: false

      - name: Run DocuGuard unit tests
        env:
          DOCUGUARD_LLM_MODE: off
        run: python -m unittest discover -s tests -v

      - name: Replay historical candidates in Click
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOCUGUARD_OPENAI_BASE_URL: ${{ vars.DOCUGUARD_OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          DOCUGUARD_LLM_MODEL: ${{ vars.DOCUGUARD_LLM_MODEL || 'gpt-6.2-astra' }}
          DOCUGUARD_EMBEDDING_MODEL: ${{ vars.DOCUGUARD_EMBEDDING_MODEL || 'text-embedding-3-small' }}
          DOCUGUARD_USE_EMBEDDINGS: ${{ vars.DOCUGUARD_USE_EMBEDDINGS || 'true' }}
          DOCUGUARD_LLM_MODE: ${{ inputs.llm_mode || 'auto' }}
        run: |
          python -m docuguard.history_replay \
            --repo targets/click \
            --window-days "${{ inputs.window_days || '365' }}" \
            --max-pairs "${{ inputs.max_pairs || '2' }}" \
            --max-history-commits 4000 \
            --llm-mode "${{ inputs.llm_mode || 'auto' }}" \
            --timeout 180 \
            --output reports/click-history.json \
            --markdown-out reports/click-history.md

      - name: Replay historical candidates in HTTPX
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOCUGUARD_OPENAI_BASE_URL: ${{ vars.DOCUGUARD_OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          DOCUGUARD_LLM_MODEL: ${{ vars.DOCUGUARD_LLM_MODEL || 'gpt-6.2-astra' }}
          DOCUGUARD_EMBEDDING_MODEL: ${{ vars.DOCUGUARD_EMBEDDING_MODEL || 'text-embedding-3-small' }}
          DOCUGUARD_USE_EMBEDDINGS: ${{ vars.DOCUGUARD_USE_EMBEDDINGS || 'true' }}
          DOCUGUARD_LLM_MODE: ${{ inputs.llm_mode || 'auto' }}
        run: |
          python -m docuguard.history_replay \
            --repo targets/httpx \
            --window-days "${{ inputs.window_days || '365' }}" \
            --max-pairs "${{ inputs.max_pairs || '2' }}" \
            --max-history-commits 4000 \
            --llm-mode "${{ inputs.llm_mode || 'auto' }}" \
            --timeout 180 \
            --output reports/httpx-history.json \
            --markdown-out reports/httpx-history.md

      - name: Add combined evaluation summary
        if: always()
        run: |
          echo '# DocuGuard public-repository historical replay' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '> Transient provider failures are retried. In auto mode, deterministic fallback is labelled in each replay result.' >> "$GITHUB_STEP_SUMMARY"
          for report in reports/click-history.md reports/httpx-history.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo '' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No Markdown report was produced for $report." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload historical replay reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docuguard-public-repository-history
          path: reports/
          if-no-files-found: warn
          retention-days: 30
