name: DocuGuard Documentation Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  documentation-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run DocuGuard tests
        run: python -m unittest discover -s tests -v

      - name: Run DocuGuard and generate reports
        env:
          DOCUGUARD_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python app.py --html-out docuguard-report.html --json-out docuguard-report.json

      - name: Upload DocuGuard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docuguard-report
          path: |
            docuguard-report.html
            docuguard-report.json
          if-no-files-found: ignore
          retention-days: 14
