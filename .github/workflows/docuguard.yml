
name: DocuGuard Documentation Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  documentation-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run DocuGuard tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run DocuGuard
        env:
          DOCUGUARD_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python app.py
