name: DocuGuard Documentation Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  documentation-drift:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DOCUGUARD_OPENAI_BASE_URL: ${{ vars.DOCUGUARD_OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
      DOCUGUARD_LLM_MODEL: ${{ vars.DOCUGUARD_LLM_MODEL || 'gpt-6.2-astra' }}
      DOCUGUARD_EMBEDDING_MODEL: ${{ vars.DOCUGUARD_EMBEDDING_MODEL || 'text-embedding-3-small' }}
      DOCUGUARD_USE_EMBEDDINGS: ${{ vars.DOCUGUARD_USE_EMBEDDINGS || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run DocuGuard tests
        env:
          DOCUGUARD_LLM_MODE: off
        run: python -m unittest discover -s tests -v

      - name: Run DocuGuard and generate reports
        env:
          DOCUGUARD_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCUGUARD_LLM_MODE: auto
        run: python app.py --html-out docuguard-report.html --json-out docuguard-report.json

      - name: Upload DocuGuard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docuguard-report
          path: |
            docuguard-report.html
            docuguard-report.json
          if-no-files-found: ignore
          retention-days: 14
